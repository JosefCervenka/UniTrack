<mat-card>
  <mat-card-header>
    <mat-card-title>Login</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" name="email" [(ngModel)]="model.email" required />
        @if (fieldError('email'); as msg) {
          <mat-hint class="error-msg">{{ msg }}</mat-hint>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" name="password" [(ngModel)]="model.password" required />
        @if (fieldError('password'); as msg) {
          <mat-hint class="error-msg">{{ msg }}</mat-hint>
        }
      </mat-form-field>

      @if (generalError(); as msg) {
        <p class="error-msg">{{ msg }}</p>
      }

      <button mat-flat-button type="submit">Login</button>
    </form>
  </mat-card-content>
</mat-card>
