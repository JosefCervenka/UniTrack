<mat-card>
  <mat-card-header>
    <mat-card-title>Create your account</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput name="userName" [(ngModel)]="model.userName" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" name="email" [(ngModel)]="model.email" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Given name</mat-label>
        <input matInput name="givenName" [(ngModel)]="model.givenName" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Surname</mat-label>
        <input matInput name="surname" [(ngModel)]="model.surname" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone number</mat-label>
        <input matInput type="tel" name="phoneNumber" [(ngModel)]="model.phoneNumber" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" name="password" [(ngModel)]="model.password" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Confirm password</mat-label>
        <input matInput type="password" name="passwordAgain" [(ngModel)]="model.passwordAgain" required />
      </mat-form-field>

      <button mat-flat-button type="submit">Create account</button>
    </form>
  </mat-card-content>
</mat-card>
